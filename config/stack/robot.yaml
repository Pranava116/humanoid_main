# config/stack/robot.yaml — the ONE joint table of the autonomy stack (robot/ package).
#
# Angles here are in JOINT coordinates (the URDF / MuJoCo convention), degrees.
# The HAL maps them to the servo:
#   rel_deg   = sign * q_deg                       (sign: sim joint direction -> servo direction)
#   rel_deg  clamped to [min_deg, max_deg] and so that offset + rel_deg stays within +-90
#   servo_deg = rel_deg + offset + 90, clamped to 0..180
#
# Offsets come from offsets_file (keys = channel on board 0x40). Joints on other boards
# take offset_deg from this table (default 0). Signs start at +1; set them on the robot
# with tools/calibrate_signs.py.

i2c:
  servo_bus: 3          # software I2C: SDA GPIO23 (pin 16), SCL GPIO24 (pin 18)
  imu_bus: 1            # hardware I2C (pins 3/5); may move to 3

boards:                 # PCA9685 boards
  - {address: 0x40, required: true}
  # a second board would be: - {address: 0x41, required: false}  (its joints are skipped when absent)

pwm:
  frequency: 50
  min_us: 500
  max_us: 2500
  write_deadband_deg: 0.1   # skip I2C writes smaller than this

offsets_file: data/calibration/offsets.json   # read only

imu:
  address: 0x68
  calibration_file: data/calibration/mpu9250_calibration.json   # read only (accel offsets in g)
  gyro_bias_samples: 300     # boot gyro bias estimate, robot must be still
  axis_map: ["+x", "+y", "+z"]   # body axis <- sensor axis (body: x forward, y left, z up)
  filter_alpha: 0.98          # complementary filter, weight of the gyro

camera:
  source: auto               # auto | picamera2 | opencv | none
  index: 0                   # OpenCV device index
  width: 320
  height: 240
  fps: 15

sim:
  scene: models/scene.xml
  urdf: models/humanoid_v3.urdf    # generated by tools/import_cad_urdf.py (old model: humanoid_latest.urdf)
  physics_dt: 0.002
  camera_name: head_cam
  imu_noise:
    gyro_std: 0.0            # rad/s
    accel_std: 0.0           # m/s^2

joints:
  # Robot v3 (models/Assembly001 (3).urdf via tools/import_cad_urdf.py): 16 servos on one board.
  # Limits: the old table cut down so offset + angle stays within the servo's 0..180 for either
  # sign (signs are not calibrated yet). Knees bend backward only (shin back, like a human): 0..max.
  # name             board  ch   sign  min_deg  max_deg  default_deg
  R_shoulder_pitch: {board: 0x40, channel: 0,  sign: 1, min_deg: -90.0,  max_deg: 90.0,  default_deg: 0.0}
  R_arm_roll:       {board: 0x40, channel: 1,  sign: 1, min_deg: -11.46, max_deg: 90.0,  default_deg: 0.0}
  R_elbow:          {board: 0x40, channel: 2,  sign: 1, min_deg: -90.0,  max_deg: 90.0,  default_deg: 0.0}
  L_shoulder_pitch: {board: 0x40, channel: 3,  sign: 1, min_deg: -90.0,  max_deg: 90.0,  default_deg: 0.0}
  L_arm_roll:       {board: 0x40, channel: 4,  sign: 1, min_deg: -11.46, max_deg: 90.0,  default_deg: 0.0}
  L_elbow:          {board: 0x40, channel: 5,  sign: 1, min_deg: -90.0,  max_deg: 90.0,  default_deg: 0.0}
  R_hip_roll:       {board: 0x40, channel: 6,  sign: 1, min_deg: -34.38, max_deg: 34.38, default_deg: 0.0}
  R_hip_pitch:      {board: 0x40, channel: 7,  sign: 1, min_deg: -74.0,  max_deg: 74.0,  default_deg: 0.0}
  R_knee:           {board: 0x40, channel: 8,  sign: 1, min_deg: 0.0,    max_deg: 90.0,  default_deg: 0.0}
  R_ankle_pitch:    {board: 0x40, channel: 9,  sign: 1, min_deg: -57.30, max_deg: 57.30, default_deg: 0.0}
  R_foot_roll:      {board: 0x40, channel: 10, sign: 1, min_deg: -34.38, max_deg: 34.38, default_deg: 0.0}
  L_hip_roll:       {board: 0x40, channel: 11, sign: 1, min_deg: -34.38, max_deg: 34.38, default_deg: 0.0}
  L_hip_pitch:      {board: 0x40, channel: 12, sign: 1, min_deg: -69.0,  max_deg: 69.0,  default_deg: 0.0}
  L_knee:           {board: 0x40, channel: 13, sign: 1, min_deg: 0.0,    max_deg: 90.0,  default_deg: 0.0}   # offset -39: the servo may reach only 51 (HAL clamps)
  L_ankle_pitch:    {board: 0x40, channel: 14, sign: 1, min_deg: -57.30, max_deg: 57.30, default_deg: 0.0}
  L_foot_roll:      {board: 0x40, channel: 15, sign: 1, min_deg: -34.38, max_deg: 34.38, default_deg: 0.0}
