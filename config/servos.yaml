```yaml
# config/servos.yaml
#
# hardware_angle = center + (invert ? -logical : logical) + offset
#
# center comes from robot.yaml (servo_defaults.center)
# min_angle / max_angle are LOGICAL limits, applied before offset
# home is the logical angle used for the home pose
#
# offset: null = NOT CALIBRATED YET.
# The loader should refuse to move these.
#
# Limits are conservative placeholders.
# Verify all limits and directions during physical calibration.

# ---------------- Board 0 (0x40) ----------------

# Arms
L_shoulder_pitch: {board: 0, channel: 1, offset: null,  invert: false, min_angle: -90, max_angle: 90, home: 0}
R_shoulder_pitch: {board: 0, channel: 3, offset: 64.0, invert: false, min_angle: -90, max_angle: 90, home: 0}
L_arm_roll:       {board: 0, channel: 4, offset: null,  invert: false, min_angle: -11.46, max_angle: 90, home: 0}

# Legs - right
R_hip_roll:    {board: 0, channel: 6,  offset: -3.0,  invert: false, min_angle: -34.38, max_angle: 34.38, home: 0}
R_hip_pitch:   {board: 0, channel: 7,  offset: -16.0, invert: false, min_angle: -85.94, max_angle: 85.94, home: 0}
R_knee:        {board: 0, channel: 8,  offset: -14.0, invert: false, min_angle: -90, max_angle: 90, home: 0}
R_ankle_pitch: {board: 0, channel: 9,  offset: -19.0, invert: false, min_angle: -57.30, max_angle: 57.30, home: 0}
R_foot_roll:   {board: 0, channel: 10, offset: -3.0,  invert: false, min_angle: -34.38, max_angle: 34.38, home: 0}

# Legs - left
L_hip_roll:    {board: 0, channel: 11, offset: -39.0, invert: false, min_angle: -34.38, max_angle: 34.38, home: 0}
L_hip_pitch:   {board: 0, channel: 12, offset: -21.0, invert: false, min_angle: -85.94, max_angle: 85.94, home: 0}
L_knee:        {board: 0, channel: 13, offset: -39.0, invert: false, min_angle: -90, max_angle: 90, home: 0}
