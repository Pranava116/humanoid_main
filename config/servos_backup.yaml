# config/servos.yaml
#
# hardware_angle = center + (invert ? -logical : logical) + offset
#   center comes from robot.yaml (servo_defaults.center)
#   min_angle / max_angle are LOGICAL limits, applied before the offset
#   home is the logical angle used for the home pose
#
# offset: null  = NOT CALIBRATED YET. The loader should refuse to move these.
# Rename every joint_bX_chY to the real joint name (e.g. left_knee).
# Limits below (-60..60) are conservative placeholders. Tighten after calibration.




